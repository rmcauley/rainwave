<div class="preferences-multi-option">
  <div class="preferences-multi-option-wrapper">
    <div class="preferences-multi-option-floating-highlight" bind="highlight"></div>
    <for each="values" bind="values">
      <span class="preferences-multi-option-value" bind="link"> {{ ^context }} </span>
    </for>
  </div>
  <label>{{ label }}</label>
</div>
