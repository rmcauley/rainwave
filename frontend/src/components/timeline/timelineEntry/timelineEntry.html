<div class="timeline-entry">
  <div class="timeline-event-animator">
    <div class="timeline-header" bind="headerContainer">
      <div class="timeline-header-text" bind="header"></div>
      <div class="timeline-header-clock" bind="clock"></div>
    </div>

    <div class="timeline-entry-progress" bind="progress">
      <div class="timeline-entry-progress-bkg">
        <div class="timeline-entry-progress-bkg-inside" bind="progressInside"></div>
      </div>
    </div>

    <div class="timeline-entry-songs" bind="songs"></div>
  </div>
</div>
