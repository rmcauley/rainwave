<div class="modal" bind="modal">
  <div class="modal-header">
    <div class="modal-header-bkg">
      <div class="modal-header-content">
        <div bind="title"></div>
        <svg
          bind="closeIcon"
          class="modal-close-icon"
          viewBox="0 0 100 100"
          use="#rw-icon-close"
        ></svg>
      </div>
    </div>
  </div>
  <div class="modal-body" bind="body"></div>
  <div class="modal-footer"></div>
</div>
