<div id="panels">
  <div id="panels-request" bind="requestPanel" class="panel"></div>
  <div id="panels-search" bind="searchPanel" class="panel"></div>
  <div id="panels-detail" bind="detailPanel" class="panel">
    <div id="panels-detail-header">
      <div bind="header"></div>
      <svg bind="closeIcon" class="rw-icon-close" viewBox="0 0 100 100" use="#rw-icon-close"></svg>
    </div>
    <div bind="body" id="panels-detail-body"></div>
  </div>
</div>
