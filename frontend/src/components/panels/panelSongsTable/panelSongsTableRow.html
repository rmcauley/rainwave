<tr class="panel-song-table-row-detail-icon" bind="row">
  <td class="panel-song-table-row-detail-icon" bind="detailIcon">
    <svg use="#rw-icon-info"></svg>
  </td>
  <td class="panel-song-table-row-fave" title="fave"></td>
  <td class="panel-song-table-row-title" title="{{ song.title }}" bind="title">{{ song.title }}</td>

  <if condition="showCooldown">
    <td class="panel-song-table-row-cooldown" bind="cooldown"></td>
    <td class="panel-song-table-row-length" bind="length"></td>
  </if>
  <if condition="showRatingClear">
    <td class="panel-song-table-row-rating-clear">
      <svg use="#rw-icon-close" bind="ratingClear"></svg>
    </td>
  </if>
  <td class="panel-song-table-row-rating" bind="rating"></td>
  <if condition="showRatingNumber">
    <td class="panel-song-table-row-rating-number" bind="ratingNumber"></td>
  </if>
  <if condition="showArtists">
    <td class="artists">
      <for each="artists">
        <a href="#!/artist/{{ id }}">{{ name }}</a>
      </for>
    </td>
  </if>
  <if condition="showLinks">
    <td class="panel-song-table-row-url">
      <if condition="song.url">
        <a class="url" href="{{ song.url }}" target="_blank"></a>
      </if>
    </td>
  </if>
</tr>
