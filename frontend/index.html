        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;

    <link rel="preload" href="/static/roboto.woff2" as="font" type="font/woff2" />

    <script vite-ignore src="/api4/bootstrap" async></script>
    <script type="module" src="/src/index.ts"></script>

    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="icon" href="/static/favicon.ico" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1978B7" />
    <meta name="msapplication-navbutton-color" content="#1978B7" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#1978B7" />

    <meta property="og:title" content="Rainwave" />
    <meta property="og:site_name" content="Rainwave" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Listen, rate, and request your favourite video game music."

    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://rainwave.cc" />

                  id="audio_volume_indicator"
                  x="0"
                  y="0"
                  width="100"
                  height="100"
