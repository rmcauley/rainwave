[project]
name = "rainwave"
version = "6.0.0"
description = "rainwave.cc"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
  "aiohttp==3.14.5",
  "aiomcache==0.8.2",
  "babel==2.18.0",
  "bcrypt==5.0.0",
  "lxml==6.1.3",
  "mutagen==1.48.1",
  "orjson==3.13.0",
  "pillow==13.0.0",
  "psycopg-pool==3.3.3",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "watchfiles==1.3.0",
  "python-dotenv==1.2.4",
  "pytz>=2026.5",
  "pyzmq==27.2.0",
  "qrcode==8.2",
  "requests==2.34.2",
  "tornado==6.5.10",
  "types-lxml==2026.2.16",
  "types-pytz==2026.5.0.20261006",
  "types-requests==2.33.0.20261006",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "black==26.10.1",
  "datamodel-code-generator==0.83.0",
  "mypy==2.4.0",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "testcontainers==4.15.0",
]

[tool.mypy]
files = "src/**/*.py"
mypy_path = ["src", "src/typestubs"]
exclude = ["frontend", "admin_panel", "stream_widget"]
explicit_package_bases = true

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
sigterm = true
source = ["src"]
omit = ["src/tests/*", "src/typestubs/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { certifi = false }
