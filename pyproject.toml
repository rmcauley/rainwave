[project]
name = "rainwave"
version = "6.0.0"
description = "rainwave.cc"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "aiohttp>=3.13.3,<4",
    "aiomcache>=0.8.2,<0.9",
    "babel>=2.18.0,<3",
    "bcrypt>=5.0.0,<6",
    "datamodel-code-generator>=0.54.0,<0.82",
    "lxml>=6.0.2,<7",
    "mutagen>=1.47.0,<2",
    "orjson>=3.11.7,<4",
    "pillow>=12.1.0,<13",
    "psycopg-pool>=3.3.0,<4",
    "psycopg[binary]>=3.3.2,<4",
    "pydantic>=2.12.5,<3",
    "watchfiles>=1.1.1,<2",
    "python-dotenv>=1.2.1,<2",
    "pytz>=2025.2",
    "pyzmq>=27.1.0,<28",
    "qrcode>=8.2,<9",
    "requests>=2.32.5,<3",
    "tornado>=6.5.4,<7",
    "types-lxml>=2026.2.16",
    "types-pytz>=2025.2.0.20251108",
    "types-requests>=2.32.4.20260107,<3",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=26.1.0,<27",
    "mypy>=1.19.1,<2",
    "pyright>=1.1.408,<2",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.1.0,<8",
    "testcontainers>=4.14.1,<5",
]

[tool.mypy]
files = "src/**/*.py"
mypy_path = ["src", "src/typestubs"]
exclude = ["frontend", "admin_panel", "stream_widget"]
explicit_package_bases = true

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
sigterm = true
source = ["src"]
omit = [
    "src/tests/*",
    "src/typestubs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.uv]
exclude-newer = "7 days"
